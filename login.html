<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - College Resource Booking</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            padding: 1.5rem;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 16px;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.25);
        }

        .header {
            text-align: center;
            margin-bottom: 1.75rem;
        }

        .header h1 {
            font-size: 1.6rem;
            color: #0f172a;
            margin-bottom: 0.35rem;
        }

        .header p {
            font-size: 0.9rem;
            color: #64748b;
        }

        .badge {
            display: inline-block;
            margin-top: 0.5rem;
            background: #e0e7ff;
            color: #4338ca;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 0.5rem;
        }

        .input-wrapper {
            position: relative;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .toggle-btn {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #64748b;
            font-size: 0.85rem;
        }

        .btn-submit {
            width: 100%;
            padding: 0.8rem 1rem;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background: #6366f1;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background: #4f46e5;
        }

        .hash-display {
            display: none;
            margin-top: 1.5rem;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 1rem;
            font-size: 0.8rem;
        }

        .hash-display.active {
            display: block;
        }

        .hash-title {
            font-weight: 700;
            color: #334155;
            margin-bottom: 0.35rem;
            display: flex;
            justify-content: space-between;
        }

        .hash-value {
            word-break: break-all;
            background: #1e293b;
            color: #38bdf8;
            padding: 0.5rem;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

    <main class="login-card">
        <div class="header">
            <h1>College Resource Booking</h1>
            <p>User Authentication Portal</p>
            <span class="badge">SHA-256 Secured</span>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">College Email</label>
                <input 
                    type="email" 
                    id="email" 
                    placeholder="student@college.edu" 
                    required 
                    autocomplete="email"
                />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Enter password" 
                        required 
                        autocomplete="current-password"
                    />
                    <button 
                        type="button" 
                        class="toggle-btn" 
                        onclick="togglePassword()"
                    >
                        Show
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit">Sign In & Hash</button>
        </form>

        <div id="hashBox" class="hash-display">
            <div class="hash-title">
                <span>Computed SHA-256 Hash:</span>
                <span style="color: #10b981;">Generated</span>
            </div>
            <div id="hashOutput" class="hash-value"></div>
        </div>
    </main>

    <script>
        async function hashSHA256(str) {
            const encoder = new TextEncoder();
            const data = encoder.encode(str);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const rawPassword = document.getElementById('password').value;

            // Compute SHA-256 hash
            const passwordHash = await hashSHA256(rawPassword);

            // Display hash on UI
            document.getElementById('hashOutput').textContent = passwordHash;
            document.getElementById('hashBox').classList.add('active');

            console.log('Login Payload:', { email, passwordHash });
        }

        function togglePassword() {
            const pwd = document.getElementById('password');
            const btn = document.querySelector('.toggle-btn');
            const isHidden = pwd.type === 'password';
            pwd.type = isHidden ? 'text' : 'password';
            btn.textContent = isHidden ? 'Hide' : 'Show';
        }
    </script>
</body>
</html>
